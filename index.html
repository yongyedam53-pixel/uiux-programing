<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>다이어트 하는 법</title>
</head>
<body>
  <header>
    <h1>다이어트 하는 법</h1>
    <p>적절한 식단과 규칙적인 운동을 통해 건강한 다이어트를 성공합니다!</p>
  </header>

  <h2>서비스 소개</h2>
  <h3>규칙적인 식단과 운동을 할 수 있는 연습</h3>

  <h2>훈련 기능</h2>
  <ul>
    <li>
      <h3>식단 관리 연습</h3>
      <p>원하는 감량 수치와 기간에 대한 묙표를 정하고 구체적인 계획을 세웁니다.</p>
    </li>
    <li>
      <h3>지속 가능한 운동 연습</h3>
      <p>원하는 목표에 맞게 본인의 기초대사량을 확인하여 적절한 강도를 설정합니다. </p>
    </li>
    <li>
      <h3>다이어트에 대한 마음가짐</h3>
      <p>마음을 여유롭게 가지고 장기적인 효과를 노리며 꾸준히 실천하는 것이 중요합니다.
    </li>
  </ul>
</body>

</html>
